<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimensiuni și proporții — DOSAR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body class="theme-sizes"><main class="page-shell"><nav class="folder-tabs"></nav><section class="folder"><header class="page-head"><div><span class="eyebrow">Print, foto și ecrane</span><h1>Dimensiuni</h1></div><div class="big-icon"><i class="fa-solid fa-crop-simple"></i></div></header><div class="quick-grid"><article class="quick-card"><h3>Redimensionare proporțională</h3><div class="row g-2"><div class="col"><input id="oldW" type="number" value="1920" class="form-control" placeholder="Lățime"></div><div class="col"><input id="oldH" type="number" value="1080" class="form-control" placeholder="Înălțime"></div></div><label class="form-label mt-2">Lățime nouă</label><input id="newW" type="number" value="1280" class="form-control"><div id="resizeResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Raport de aspect</h3><div class="row g-2"><div class="col"><input id="ratioW" type="number" value="1920" class="form-control"></div><div class="col"><input id="ratioH" type="number" value="1080" class="form-control"></div></div><div id="ratioResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Pixeli ↔ centimetri</h3><input id="pixels" type="number" value="2480" class="form-control mb-2" placeholder="Pixeli"><input id="dpi" type="number" value="300" class="form-control" placeholder="DPI"><div id="cmResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Calculează PPI</h3><input id="screenW" type="number" value="2560" class="form-control mb-2" placeholder="Pixeli lățime"><input id="screenH" type="number" value="1440" class="form-control mb-2" placeholder="Pixeli înălțime"><input id="diagonal" type="number" value="27" class="form-control" placeholder="Diagonală inch"><div id="ppiResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Formate de print la 300 DPI</h3><select id="printSize" class="form-select"><option value="21,29.7">A4</option><option value="29.7,42">A3</option><option value="14.8,21">A5</option><option value="10,15">Foto 10×15</option><option value="13,18">Foto 13×18</option></select><div id="printResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Rezoluții uzuale</h3><select id="resolution" class="form-select"><option>Full HD — 1920 × 1080</option><option>4K UHD — 3840 × 2160</option><option>Instagram pătrat — 1080 × 1080</option><option>Instagram portret — 1080 × 1350</option><option>Story / Reels — 1080 × 1920</option><option>Facebook cover — 851 × 315</option><option>YouTube thumbnail — 1280 × 720</option></select><div class="result-box mt-2 fw-bold">Selectează formatul și copiază dimensiunea.</div></article></div></section></main><script src="/common.js"></script><script src="/dimensions.js"></script></body></html>
