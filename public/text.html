<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text — DOSAR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body class="theme-words"><main class="page-shell"><nav class="folder-tabs"></nav><section class="folder"><header class="page-head"><div><span class="eyebrow">Prelucrare instantanee</span><h1>Text</h1></div><div class="big-icon"><i class="fa-solid fa-font"></i></div></header><div class="panel"><textarea id="textInput" class="form-control" rows="9" placeholder="Scrie sau lipește textul aici..."></textarea><div class="stat-grid my-3"><div class="stat"><strong id="chars">0</strong>caractere</div><div class="stat"><strong id="words">0</strong>cuvinte</div><div class="stat"><strong id="sentences">0</strong>propoziții</div></div><div class="utility-switcher"><button data-text="upper" class="utility-chip">MAJUSCULE</button><button data-text="lower" class="utility-chip">minuscule</button><button data-text="title" class="utility-chip">Prima Literă Mare</button><button data-text="diacritics" class="utility-chip">Fără diacritice</button><button data-text="spaces" class="utility-chip">Spații curate</button><button data-text="slug" class="utility-chip">Slug URL</button><button data-text="reverse" class="utility-chip">Inversează</button><button data-text="json" class="utility-chip">Formatează JSON</button><button data-text="b64e" class="utility-chip">Base64 encode</button><button data-text="b64d" class="utility-chip">Base64 decode</button></div><div class="row g-2 mt-2"><div class="col"><input id="findText" class="form-control" placeholder="Caută"></div><div class="col"><input id="replaceText" class="form-control" placeholder="Înlocuiește cu"></div><div class="col-auto"><button id="replaceBtn" class="btn btn-accent h-100">Înlocuiește</button></div></div></div></section></main><script src="/common.js"></script><script src="/text-tools.js"></script></body></html>
