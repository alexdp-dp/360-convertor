<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dată și timp — DOSAR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body class="theme-date"><main class="page-shell"><nav class="folder-tabs"></nav><section class="folder"><header class="page-head"><div><span class="eyebrow">Calendar și cronometre</span><h1>Dată și timp</h1></div><div class="big-icon"><i class="fa-solid fa-clock"></i></div></header><div class="quick-grid"><article class="quick-card"><h3>Diferență între date</h3><input id="dateA" type="date" class="form-control mb-2"><input id="dateB" type="date" class="form-control"><div id="dateDiff" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Adaugă sau scade zile</h3><input id="dateBase" type="date" class="form-control mb-2"><input id="dateDays" type="number" value="30" class="form-control"><div id="dateAdd" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Zile lucrătoare</h3><input id="workA" type="date" class="form-control mb-2"><input id="workB" type="date" class="form-control"><div id="workResult" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Unități de timp</h3><input id="timeAmount" type="number" value="120" class="form-control mb-2"><select id="timeUnit" class="form-select"><option value="60">minute</option><option value="3600">ore</option><option value="86400">zile</option></select><div id="timeConvert" class="result-box mt-2 fw-bold"></div></article><article class="quick-card"><h3>Cronometru</h3><div id="stopwatch" class="result-number my-3">00:00.0</div><button id="swStart" class="btn btn-accent">Start / pauză</button> <button id="swReset" class="btn btn-light fw-bold">Reset</button></article><article class="quick-card"><h3>Countdown</h3><input id="countdownSeconds" type="number" value="60" class="form-control mb-2"><div id="countdown" class="result-number my-3">01:00</div><button id="cdStart" class="btn btn-accent">Pornește</button></article><article class="quick-card"><h3>Fusuri orare</h3><div id="zones" class="fw-bold lh-lg"></div></article><article class="quick-card"><h3>Unix timestamp</h3><input id="unixInput" class="form-control mb-2" placeholder="Timestamp"><button id="unixNow" class="btn btn-accent">Acum</button><div id="unixResult" class="result-box mt-2 fw-bold"></div></article></div></section></main><script src="/common.js"></script><script src="/date-tools.js"></script></body></html>
